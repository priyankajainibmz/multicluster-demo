apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: task-deploy-infrastructure
  namespace: voting-app
  annotations:
    description: >
      Task 2 of 4. Deploys the infrastructure layer: Redis cache.
      Waits for it to be Ready before proceeding, so the application
      layer has a healthy backing store when it starts.
spec:
  params:
    - name: spoke-server
      type: string
    - name: spoke-token
      type: string
    - name: target-namespace
      type: string
      default: "voting-app"
    - name: redis-image
      type: string
      default: "docker.io/library/redis:7-alpine"

  stepTemplate:
    image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
    env:
      - name: SPOKE_SERVER
        value: $(params.spoke-server)
      - name: SPOKE_TOKEN
        value: $(params.spoke-token)
      - name: TARGET_NS
        value: $(params.target-namespace)

  steps:

    # ── Step 1: Deploy Redis ───────────────────────────────────────
    - name: deploy-redis
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        oc login --token="${SPOKE_TOKEN}" --server="${SPOKE_SERVER}" --insecure-skip-tls-verify=true

        echo "=================================================="
        echo "  TASK 2/4: DEPLOY INFRASTRUCTURE"
        echo "=================================================="
        echo ""
        echo ">>> Deploying Redis cache to spoke cluster..."
        sleep 3

        oc apply -n "${TARGET_NS}" -f - <<EOF
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: redis
          namespace: ${TARGET_NS}
          labels:
            app: redis
            app.kubernetes.io/part-of: voting-app
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: redis
          template:
            metadata:
              labels:
                app: redis
            spec:
              containers:
              - name: redis
                image: $(params.redis-image)
                ports:
                - containerPort: 6379
                resources:
                  requests:
                    cpu: "100m"
                    memory: "128Mi"
                  limits:
                    cpu: "500m"
                    memory: "256Mi"
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: redis
          namespace: ${TARGET_NS}
          labels:
            app: redis
            app.kubernetes.io/part-of: voting-app
        spec:
          selector:
            app: redis
          ports:
          - port: 6379
            targetPort: 6379
        EOF

        echo ""
        echo ">>> Redis manifest applied. Watching pod come up..."
        sleep 5

    # ── Step 2: Wait for Redis to be Ready ────────────────────────
    - name: wait-for-redis
      timeout: "5m"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        oc login --token="${SPOKE_TOKEN}" --server="${SPOKE_SERVER}" --insecure-skip-tls-verify=true

        echo ">>> Waiting for Redis pod to reach Running state..."
        echo "    (watch the spoke Console: Developer → Topology → voting-app)"
        echo ""

        # Poll visibly so demo audience can see the wait
        for i in $(seq 1 24); do
          PHASE=$(oc get pods -n "${TARGET_NS}" -l app=redis \
            -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "Pending")
          echo "  [${i}/24] Redis pod phase: ${PHASE}"
          [[ "${PHASE}" == "Running" ]] && break
          sleep 5
        done

        oc rollout status deployment/redis -n "${TARGET_NS}" --timeout=3m
        echo ""
        echo ">>> Redis is Ready."
        sleep 3

        echo ""
        echo ">>> Infrastructure layer deployed:"
        oc get pods,svc -n "${TARGET_NS}" -l app=redis
        sleep 4

        echo ""
        echo "=================================================="
        echo "  TASK 2/4 COMPLETE"
        echo "=================================================="
