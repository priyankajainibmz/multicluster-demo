apiVersion: v1
kind: Secret
metadata:
  name: spoke-cluster-credentials
  namespace: multicluster-demo
type: Opaque
stringData:
  # Replace these values before applying.
  # Get the token with:
  #   oc create token pipeline -n multicluster-demo --duration=8760h
  # (or use an existing long-lived service account token)
  spoke-server: "https://api.YOUR-SPOKE-CLUSTER.example.com:6443"
  spoke-token: "sha256~REPLACE_WITH_REAL_TOKEN"
